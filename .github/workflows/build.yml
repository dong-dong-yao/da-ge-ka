name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      - name: Restore dependencies
        run: dotnet restore .\CheckInReminder.slnx

      - name: Run tests
        run: dotnet test .\CheckInReminder.slnx -c Release --no-restore

      - name: Build Release
        run: dotnet build .\CheckInReminder.slnx -c Release --no-restore
